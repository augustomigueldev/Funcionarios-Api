<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema DP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/funcionarios/listar">Sistema DP</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link {% if '/listar' in request.path %}active fw-semibold{% endif %}" href="/funcionarios/listar">Funcionários</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if '/cargos' in request.path or '/cadastroCargo' in request.path %}active fw-semibold{% endif %}" href="/funcionarios/cargos">Cargos</a>
            </li>
          </ul>
          {% block navbar_extra %}{% endblock %}
          <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-muted small">Olá, <strong>{{ user.username }}</strong></span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Sair</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    </div>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
