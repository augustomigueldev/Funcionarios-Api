<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema DP</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/funcionarios/listar">Funcionários</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/funcionarios/cargos">Cargos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4" style="max-width: 600px;">
      <h2>Cadastro de Funcionário</h2>
      <form method="POST" action="/funcionarios/cadastro">
        {% csrf_token %}

        <div class="mb-3">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" class="form-control" name="nome" id="nome" required>
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" name="cpf" id="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" name="email" id="email" required>
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="text" class="form-control" name="telefone" id="telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="mb-3">
          <label for="data_admissao" class="form-label">Data de Admissão</label>
          <input type="date" class="form-control" name="data_admissao" id="data_admissao" required>
        </div>

        <div class="mb-3">
          <label for="salario" class="form-label">Salário (R$)</label>
          <input type="number" class="form-control" name="salario" id="salario" step="0.01" min="0" required>
        </div>

        <div class="mb-3">
          <label for="cargo" class="form-label">Cargo</label>
          <select class="form-select" name="cargo" id="cargo" required>
            {% for cargo in cargos %}
            <option value="{{ cargo.id }}">{{ cargo.nome }}</option>
            {% empty %}
            <option disabled>Nenhum cargo cadastrado</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/funcionarios/listar" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
