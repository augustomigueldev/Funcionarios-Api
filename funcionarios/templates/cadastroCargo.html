<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Cargo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema DP</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/funcionarios/listar">Funcionários</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/funcionarios/cargos">Cargos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4" style="max-width: 400px;">
      <h2>Cadastro de Cargo</h2>
      <form method="POST" action="/funcionarios/cadastroCargo">
        {% csrf_token %}
        <div class="mb-3">
          <label for="nome" class="form-label">Nome do Cargo</label>
          <input type="text" class="form-control" name="nome" id="nome" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/funcionarios/cargos" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
