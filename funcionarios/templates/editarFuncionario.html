{% extends "base.html" %}

{% block title %}Editar Funcionário — Sistema DP{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
  <h2>Editar Funcionário</h2>
  <form method="POST" action="/funcionarios/editar/{{ funcionario.id }}">
    {% csrf_token %}

    <div class="mb-3">
      <label for="nome" class="form-label">Nome completo</label>
      <input type="text" class="form-control" name="nome" id="nome" value="{{ funcionario.nome }}" required>
    </div>

    <div class="mb-3">
      <label for="cpf" class="form-label">CPF</label>
      <input type="text" class="form-control" name="cpf" id="cpf" value="{{ funcionario.cpf }}" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" class="form-control" name="email" id="email" value="{{ funcionario.email }}" required>
    </div>

    <div class="mb-3">
      <label for="telefone" class="form-label">Telefone</label>
      <input type="text" class="form-control" name="telefone" id="telefone" value="{{ funcionario.telefone }}">
    </div>

    <div class="mb-3">
      <label for="data_admissao" class="form-label">Data de Admissão</label>
      <input type="date" class="form-control" name="data_admissao" id="data_admissao" value="{{ funcionario.data_admissao|date:'Y-m-d' }}" required>
    </div>

    <div class="mb-3">
      <label for="salario" class="form-label">Salário (R$)</label>
      <input type="number" class="form-control" name="salario" id="salario" step="0.01" min="0" value="{{ funcionario.salario }}" required>
    </div>

    <div class="mb-3">
      <label for="cargo" class="form-label">Cargo</label>
      <select class="form-select" name="cargo" id="cargo" required>
        {% for cargo in cargos %}
        <option value="{{ cargo.id }}" {% if cargo.id == funcionario.cargo.id %}selected{% endif %}>
          {{ cargo.nome }}
        </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Salvar alterações</button>
    <a href="/funcionarios/listar" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/imask"></script>
<script>
  IMask(document.getElementById('cpf'), { mask: '000.000.000-00' });
  IMask(document.getElementById('telefone'), { mask: '(00) 00000-0000' });
</script>
{% endblock %}
