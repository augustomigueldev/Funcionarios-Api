<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cargos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema DP</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/funcionarios/listar">Funcionários</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/funcionarios/cargos">Cargos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <h2>Lista de Cargos</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome do Cargo</th>
          </tr>
        </thead>
        <tbody>
          {% for cargo in cargos %}
          <tr>
            <td>{{ cargo.id }}</td>
            <td>{{ cargo.nome }}</td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="2" class="text-center">Nenhum cargo cadastrado.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <a href="/funcionarios/cadastroCargo" class="btn btn-primary">Novo Cargo</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
